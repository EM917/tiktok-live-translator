<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-en="Floating Window · TikTok Live Translator">浮窗 · TikTok 直播同传</title>
<link rel="stylesheet" href="/static/float.css?v=5">
<!-- i18n: done -->
</head>
<body>
  <!-- 浮窗：app/float_window.py 开的置顶小窗。只显示最新一条字幕和最近几条弹幕，不显示报警，不发任何消息
       （连的是 /ws?role=float，服务端对它只转发需要的几种消息）。样子和规则见 web/float.js。
       字幕和弹幕正文带 class i18n-data（留给浏览器翻译，英文界面的检查也豁免）；昵称由 float.js 标 translate="no" -->
  <main id="f-root" class="f-root">
    <!-- 结束卡片（专家审查 U3）：监听自己停了（下播、出错）时浮窗不再直接消失，字幕和弹幕收起、露出这一张。
         标题和说明由 float.js 按状态写（floatEndView）；按钮走 pywebview 的 JS 桥把主窗口提到前面，不发 WebSocket
         消息，没有 JS 桥时不画 -->
    <section id="f-end" class="f-end hidden" role="status">
      <div id="f-end-title" class="f-end-title"></div>
      <div id="f-end-note" class="f-end-note"></div>
      <button id="f-end-back" class="f-end-back hidden" type="button" data-en="Show Main Window">回到主窗口</button>
    </section>
    <div id="f-empty" class="f-empty" role="status" data-en="Waiting for the first caption…">等待第一句字幕…</div>
    <section id="f-caption" class="f-caption hidden">
      <!-- 状态行：「连接中…」（断线、重连、等开播时，大字幕上那一句是旧的）、翻译状态角标（没译成、
           被积压跳过时才有）、「约 N 秒前」（这一句的声音结束超过 15 秒才有）。字都由 float.js 写，
           角标和秒数来自 live-ui.js，同中控页底部大字幕。放在字幕上面：字幕长到窗口装不下时从下面裁
           （先裁原文），这一行永远看得见 -->
      <div id="f-meta" class="f-meta hidden">
        <span id="f-conn" class="f-chip f-conn hidden"></span>
        <span id="f-chip" class="f-chip hidden"></span>
        <span id="f-lag" class="f-lag hidden"></span>
      </div>
      <div id="f-big" class="f-big i18n-data"></div>
      <div id="f-small" class="f-small i18n-data hidden"></div>
    </section>
    <section id="f-comments" class="f-comments" aria-label="弹幕" data-en-aria-label="Comments"></section>
  </main>
  <script src="/static/i18n.js?v=1"></script>
  <script src="/static/live-ui.js?v=8"></script>
  <script src="/static/guard.js?v=6"></script>
  <script src="/static/float.js?v=4"></script>
</body>
</html>
