name: CI

on:
  push:
    branches: [main]
  pull_request:
  # 每周一次：install-latest 不带 constraints 装一遍 PyPI 当天最新的（I4），提前看到上游的大版本；
  # 其余任务在 main 上照常跑一遍。workflow_dispatch 可以在 Actions 页面手动触发
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

jobs:
  test:
    timeout-minutes: 15   # 测试里有靠预算收敛的循环，回归成死循环时要红而不是挂 6 小时
    strategy:
      fail-fast: false
      matrix:
        include:
          # 3.10 是对外承诺的最低版本（用户 10-22 决定 D14：main.py、启动器、README 都写明 3.10+），
          # 必须验证。3.10 也已 EOL（2026-10），固定到具体镜像（latest 迁移后 setup-python 可能不再提供）。
          # 再提最低版本时改这一行，同步改 README、main.py 的版本检查（app/bootstrap.MIN_PYTHON）、
          # tools/find_python.sh 与 Start.bat 的下限，还有仓库 ruleset 22144351 的必需检查名
          # 「test (ubuntu-24.04, 3.10)」：任务名跟着矩阵变，ruleset 不同步改，所有 PR 都会卡在等它
          - os: ubuntu-24.04
            python: "3.10"
          - os: ubuntu-latest
            python: "3.13"
          - os: macos-latest
            python: "3.13"
          - os: windows-latest
            python: "3.13"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # 测试只依赖轻量三件套——被测模块的重型导入（faster-whisper/yt-dlp）
      # 都是函数内延迟进行的，CI 不装它们
      - name: Install test deps
        run: pip install pytest pytest-timeout numpy aiohttp
      - name: Unit tests
        # 单个测试超过两分钟就失败并打印所有线程的栈。2026-09-07 Windows 跑器
        # 三次在同一处停了 14 分半，到点整个 job 被取消——什么信息都没留下。
        run: pytest tests/ -q --timeout=120 --timeout-method=thread
      - name: Byte-compile all sources
        run: python -m compileall -q main.py app
      - name: JS unit tests
        shell: bash
        run: node --test tests/*.test.mjs

  # I4（用户决定 D8）：在干净的 venv 里真的按 requirements.txt + constraints.txt 装一遍，import 核心
  # 组件、编译源码。上面的 test 任务只装 pytest、numpy、aiohttp，从不碰真实依赖：锁的版本装不上，
  # 以前只有新装机的用户才会发现。3.13 走锁死的那一套，3.10 只受 constraints 里的上界约束。
  # 只报告、不卡合并：不在 ruleset 22144351 的必需检查里（以后改这里的任务名不用同步 ruleset）。
  # Windows 那两格先允许失败（continue-on-error），结果看日志。每格都是一次完整的首次装机（约 1.4 GB）
  install-smoke:
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]      # macos-latest 是 Apple 芯片（arm64）
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install into a fresh venv
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/tlt-venv"
          VPY="$RUNNER_TEMP/tlt-venv/bin/python"
          [ -x "$VPY" ] || VPY="$RUNNER_TEMP/tlt-venv/Scripts/python.exe"
          echo "VPY=$VPY" >> "$GITHUB_ENV"
          "$VPY" -m pip install --disable-pip-version-check -r requirements.txt -c constraints.txt
      - name: Installed versions
        shell: bash
        run: |
          "$VPY" -m pip freeze --all
          "$VPY" -m pip check || echo "::warning::pip check reported problems (see above)"
      - name: Import the core components
        shell: bash
        run: |
          "$VPY" - <<'EOF'
          import importlib
          import importlib.util
          import platform
          import sys

          for name in ("aiohttp", "numpy", "faster_whisper", "ctranslate2", "onnxruntime", "av",
                       "yt_dlp", "curl_cffi", "imageio_ffmpeg", "webview", "TikTokLive"):
              mod = importlib.import_module(name)
              print(name, getattr(mod, "__version__", ""))
          # mlx-whisper 只看装没装上：GitHub 的 macOS 跑器是虚拟机，import mlx 要碰 Metal
          if sys.platform == "darwin" and platform.machine() == "arm64":
              assert importlib.util.find_spec("mlx_whisper"), "mlx-whisper is not installed"
              print("mlx_whisper installed")
          EOF
      - name: Byte-compile all sources
        shell: bash
        run: '"$VPY" -m compileall -q main.py app'

  # 每周一次、不带 constraints：装 PyPI 当天最新的那一套，提前看到上游出了大版本之后新装机还起不起得来
  # （锁的版本该不该升，看这里）。全部允许失败、只报告，不在必需检查里
  install-latest:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]      # macos-latest 是 Apple 芯片（arm64）
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install into a fresh venv
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/tlt-venv"
          VPY="$RUNNER_TEMP/tlt-venv/bin/python"
          [ -x "$VPY" ] || VPY="$RUNNER_TEMP/tlt-venv/Scripts/python.exe"
          echo "VPY=$VPY" >> "$GITHUB_ENV"
          "$VPY" -m pip install --disable-pip-version-check -r requirements.txt
      - name: Installed versions
        shell: bash
        run: |
          "$VPY" -m pip freeze --all
          "$VPY" -m pip check || echo "::warning::pip check reported problems (see above)"
      - name: Import the core components
        shell: bash
        run: |
          "$VPY" - <<'EOF'
          import importlib
          import importlib.util
          import platform
          import sys

          for name in ("aiohttp", "numpy", "faster_whisper", "ctranslate2", "onnxruntime", "av",
                       "yt_dlp", "curl_cffi", "imageio_ffmpeg", "webview", "TikTokLive"):
              mod = importlib.import_module(name)
              print(name, getattr(mod, "__version__", ""))
          # mlx-whisper 只看装没装上：GitHub 的 macOS 跑器是虚拟机，import mlx 要碰 Metal
          if sys.platform == "darwin" and platform.machine() == "arm64":
              assert importlib.util.find_spec("mlx_whisper"), "mlx-whisper is not installed"
              print("mlx_whisper installed")
          EOF
      - name: Byte-compile all sources
        shell: bash
        run: '"$VPY" -m compileall -q main.py app'

  # G10（spec §12.3）：无头 Chrome 打开注入了假数据的英文页面，扫 DOM 里剩下的中文，量顶栏版面。
  # 只在 macOS 跑器上跑：它自带 Google Chrome 和 PingFang / SF Pro，版面余量才可信（ubuntu 上
  # Chrome 回退到 DejaVu / Liberation）。收紧闸（Z0）起整组严格跑：英文页上剩下中文、顶栏放不下，
  # PR 都是红的。Chrome 偶发到点没结果时装置自己重试一次（tests/test_i18n_dom.py 的 CHROME_RETRIES）
  dom-scan:
    timeout-minutes: 15
    runs-on: macos-latest
    env:
      TLT_DOM_SCAN: "1"
      TLT_DOM_SHOTS: dom-shots
      TLT_CHROME: /Applications/Google Chrome.app/Contents/MacOS/Google Chrome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install test deps   # 场景要 import app.pipeline，app/asr.py:26、app/audio.py:6 在模块级 import numpy
        run: pip install pytest numpy aiohttp
      - name: English DOM scan
        run: pytest tests/test_i18n_dom.py -q
      # 同一批场景的截图：英文 README 截图可以直接从这里取（spec §12.3 第 9 条）
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dom-scan-screenshots
          path: dom-shots/
          if-no-files-found: ignore

  lint:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Ruff (pinned)
        run: |
          pip install ruff==0.14.1
          ruff check .
      - name: Shell launcher syntax
        run: |
          bash -n Start.command
          bash -n setup.sh
          bash -n "TikTok Live Translator.app/Contents/MacOS/TikTokLiveTranslator"
          bash -n tools/find_python.sh
      - name: PowerShell setup script parses
        shell: pwsh
        run: |
          $tokens = $null; $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("setup.ps1", [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_.Message }; exit 1 }
      - name: JS syntax
        run: |
          node --check web/i18n.js
          node --check web/app.js
          node --check web/normalize.js
          node --check web/brand.js
          node --check web/switch.js
          node --check web/session-divider.js
          node --check web/settings-rows.js
          node --check web/follow.js
          node --check web/alerts.js
          node --check web/viewer.js
          node --check web/qrcanvas.js
          node --check web/live-ui.js
          node --check web/guard.js
          node --check tests/i18n_dom/fake_ws.js
          node --check tests/i18n_dom/scan.js
          node --check tests/i18n_dom/probe.js
